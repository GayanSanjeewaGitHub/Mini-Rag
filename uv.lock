[project]
name = "mini-rag"
version = "0.1.0"
description = "Mini RAG system with Pinecone + OpenAI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openai>=1.40.0",
    "pinecone-client>=3.2.2",
    "tiktoken>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
